name: Build and release Mac app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Expand uploaded source
        run: |
          unzip -q TypingPet-Mac-Public-source.zip -d "$RUNNER_TEMP/typingpet-source"
          rsync -a --exclude='.github/' "$RUNNER_TEMP/typingpet-source/TypingPet-Mac-Public/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Sync artwork-free native Mac source'
            git push
          fi
      - name: Test and build Apple Silicon app
        run: bash scripts/build.sh
      - name: Verify no third-party artwork is bundled
        run: |
          test ! -d dist/TypingPet.app/Contents/Resources/Characters
          if find dist/TypingPet.app -type f | grep -Ei '\.(png|gif|webp|apng|jpg|jpeg)$'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: TypingPet-artwork-free-arm64
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 dist/TypingPet-arm64.dmg dist/TypingPet-arm64.zip --clobber
          else
            gh release create v0.3.0 dist/TypingPet-arm64.dmg dist/TypingPet-arm64.zip --target main --title 'TypingPet for Mac 0.3.0 · 不含原图版' --notes-file RELEASE.md
          fi
